name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Create .env file
        run: |
          echo "PORT=5000" > .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_DATABASE=${{ secrets.DB_DATABASE }}" >> .env
          echo "DB_PORT=5432" >> .env

      - name: Build Docker image (no cache)
        run: docker build --no-cache -t ${{ secrets.DOCKER_USERNAME }}/club_ia_backend:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image-
        run: docker push ${{ secrets.DOCKER_USERNAME }}/club_ia_backend:latest

      - name: Deploy to VPS-
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY_PRIVATE }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/club_ia_backend:latest
            docker compose down
            docker compose up -d --force-recreate
            docker compose run --rm migrate
            docker compose run --rm seed
