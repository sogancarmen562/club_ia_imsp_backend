name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main] 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependancies
        run: pnpm install

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/club-ia-backend:latest .

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/club-ia-backend:latest

      - name: Done
        run: echo "Image pushed to Docker Hub!"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY_PRIVATE }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/club-ia-backend:latest
            docker stop myapp || true && docker rm myapp || true
            docker run -d --name myapp -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/club-ia-backend:latest