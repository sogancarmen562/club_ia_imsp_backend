name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Create .env file
        run: |
          echo "PORT=5000" > .env
          echo "DB_USER=myuser" >> .env
          echo "DB_PASSWORD=carmen" >> .env
          echo "DB_DATABASE=mydb" >> .env
          echo "DB_PORT=5432" >> .env

      - name: Build Docker images
        run: docker compose --env-file .env build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push images to Docker Hub
        run: docker compose --env-file .env push club_ia_backennd:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY_PRIVATE }}
          script: |
            cd club_ia_imsp_backend
            docker compose pull club_ia_backennd:latest
            docker compose up -d --build