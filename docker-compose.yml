services:
  club_ia_backend:
    build: .
    ports:
      - '${PORT}:${PORT}'
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build: .
    container_name: journal_diaspora_migrate
    env_file:
      - .env
    depends_on:
      - db
    command: pnpm run init-db
    restart: "no"

  seed:
    build: .
    container_name: journal_diaspora_seed
    env_file:
      - .env
    depends_on:
      - db
    command: npm run seed
    restart: "no"

volumes:
  pgdata:
