version: "3.9"

services:
  club_ia_backend:
    image: carmensogan20/club_ia_backend:latest
    ports:
      - '${PORT}:${PORT}'
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - '${DB_PORT}:5432'

  migrate:
    image: carmensogan20/club_ia_backend:latest
    container_name: migrate
    env_file:
      - .env
    depends_on:
      - db
    command: pnpm run init-db
    restart: "no"

  seed:
    image: carmensogan20/club_ia_backend:latest
    container_name: seed
    env_file:
      - .env
    depends_on:
      - db
    command: pnpm run seed
    restart: "no"
